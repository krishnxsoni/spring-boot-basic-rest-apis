<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .captcha-box {
            background: #f1f1f1;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 5px;
        }

        .btn-custom {
            background-color: #6c63ff;
            color: white;
        }

        .btn-custom:hover {
            background-color: #5848e5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="login-title">Login</h3>

    <form th:action="@{/submit-user-details}" method="post" th:object="${user}">
        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="userName" class="form-control" placeholder="Enter username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <!-- Captcha -->
        <div class="mb-3">
            <label class="form-label">Captcha</label>
            <div class="captcha-box mb-2">A7X9K</div>
            <input type="text" class="form-control" placeholder="Enter captcha" required>
        </div>

        <!-- Terms -->
        <!--<div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" required>
            <label name="termsAndCondition" class="form-check-label">
                I agree to the Terms & Conditions
            </label>
        </div>-->

        <!-- Submit -->
        <button type="submit" class="btn btn-custom w-100">Login</button>
    </form>
    <div class="text-center mt-4">
        <span class="me-2">New User?</span>

        <a th:href="@{/new-user}" class="btn btn-outline-primary btn-sm">
            Register Here
        </a>
    </div>
    <!--<div class="text-center mt-4">
        <p class="mb-2 text-muted">Don't have an account?</p>

        <a th:href="@{/new-user}" class="btn btn-outline-dark w-100">
            Create New Account
        </a>
    </div>-->
</div>

</body>
</html>
